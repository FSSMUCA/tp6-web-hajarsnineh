<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculatrice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mini Calculatrice</h1>
    </header>

    <main>

        <form id="calcForm" class="form-grid">
            <label for="a">Nombre A</label>
            <input type="number" id="a">

            <label for="b">Nombre B</label>
            <input type="number" id="b">

            <label for="op">Opération</label>
            <select id="op">
                <option value="+">Addition (+)</option>
                <option value="-">Soustraction (−)</option>
                <option value="*">Multiplication (×)</option>
                <option value="/">Division (÷)</option>
            </select>

            <button type="button" id="btnCalc">Calculer</button>
        </form>
        <p id="erreur" class="erreur"></p>
        <section class="card" id="zoneHistorique">
            <h2>Historique des opérations</h2>
            <ul id="listeHistorique"></ul>
        </section>

    </main>

    <footer>
        <p>Projet Calculatrice — 2025</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
